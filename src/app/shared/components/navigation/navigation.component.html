<aside class="navigation-shell">
  <!-- <div class="brand-block">
    <p class="brand-eyebrow">Cycle tracker</p>
    <h1 class="brand-title">Tracker</h1> -->
  <!-- <p class="brand-copy">Your dashboard, calendar, logs, and profile in one calm shell.</p> -->
  <!-- </div> -->

  <nav class="navigation" aria-label="Primary">
    <ul class="navigation-list">
      @for (item of navItems; track item.path) {
        <li>
          <a
            class="navigation-link"
            [routerLink]="item.path"
            routerLinkActive="is-active"
            [routerLinkActiveOptions]="{ exact: item.exact }"
            #activeLink="routerLinkActive"
            [attr.aria-current]="activeLink.isActive ? 'page' : null"
          >
            @if (isMobile()) {
              <span class="navigation-link-icon">
                <mat-icon>{{ item.icon }}</mat-icon>
              </span>
            }
            @if (!isMobile()) {
              <span class="navigation-link-label">
                <span>{{ item.label }}</span>
              </span>
            }
          </a>
        </li>
      }
    </ul>
  </nav>
</aside>
