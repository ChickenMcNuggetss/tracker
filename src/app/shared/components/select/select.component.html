<div
  class="select"
  [attr.data-disabled]="disabled() ? 'true' : null"
  [attr.data-open]="isOpen() ? 'true' : null"
>
  @if (label()) {
    <label class="select__label">
      {{ label() }}
    </label>
  }

  <button
    type="button"
    class="select__control"
    [attr.name]="name()"
    [disabled]="disabled()"
    [attr.aria-expanded]="isOpen()"
    aria-haspopup="listbox"
    (click)="toggle()"
  >
    <span class="select__value">
      @if (selectedOption; as option) {
        {{ option.label() }}
      } @else {
        {{ value() }}
      }
    </span>

    <svg
      class="select__icon"
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      aria-hidden="true"
    >
      <path
        d="m6 9 6 6 6-6"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>

  @if (isOpen()) {
    <div
      class="select__dropdown"
      role="listbox"
    >
      @for (option of options(); track option.value()) {
        <button
          type="button"
          class="select__option"
          [class.select__option--selected]="option.value() === value()"
          role="option"
          [attr.aria-selected]="option.value() === value()"
          (click)="selectOption(option)"
        >
          {{ option.label() }}
        </button>
      }
    </div>
  }
</div>
