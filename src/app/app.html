<section class="page-shell">
  <div class="page-glow page-glow-left" aria-hidden="true"></div>
  <div class="page-glow page-glow-right" aria-hidden="true"></div>

  <div class="app-shell">
    @if (updateAvailable()) {
      <aside class="update-banner" role="status" aria-live="polite">
        <span>{{ 'UpdateAvailable' | translate }}</span>
        <button type="button" (click)="reloadToUpdate()">
          {{ 'ReloadToUpdate' | translate }}
        </button>
      </aside>
    }
    <div class="app-content">
      <router-outlet />
    </div>
    <app-navigation />
  </div>
</section>
