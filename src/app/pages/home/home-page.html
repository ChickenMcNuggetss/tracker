<div class="dashboard-page">
  <header class="dashboard-hero">
    <p class="dashboard-eyebrow">{{ 'HomeDashboard' | translate }}</p>
    <h1>{{ 'HomeTitle' | translate }}</h1>
    <p class="dashboard-copy">{{ 'HomeCopy' | translate }}</p>
  </header>

  <section class="dashboard-grid" aria-label="Cycle overview">
    <app-current-cycle-day-card
      [cycleDay]="dashboard().currentCycleDay"
      [cycleLength]="dashboard().cycleLength"
    />

    <app-days-until-next-period-card
      [daysUntilNextPeriod]="dashboard().daysUntilNextPeriod"
      [cycleLength]="dashboard().cycleLength"
    />
  </section>

  <section class="dashboard-logs" aria-label="Quick log">
    <div class="calendar-details">
      <app-day-details
        [dateLabel]="formattedSelectedDateKey"
        [entry]="selectedLogEntry()"
        (editRequested)="openEditLogs()"
      />
    </div>
  </section>
</div>
<app-log-overlay />
