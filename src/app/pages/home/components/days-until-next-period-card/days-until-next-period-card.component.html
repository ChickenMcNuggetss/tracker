<article class="metric-card metric-card--next" aria-labelledby="next-period-title">
  <p class="metric-eyebrow">{{ 'Forecast' | translate }}</p>
  <h2 id="next-period-title" class="metric-title">{{ 'DaysUntilNextPeriod' | translate }}</h2>

  @if (daysUntilNextPeriod() !== null) {
    <p class="metric-value">{{ daysUntilNextPeriod() }}</p>
    <!-- <p class="metric-copy">
      {{"ForecastDescription" | translate : { cycleLength: cycleLength(), daysUntilNextPeriod: daysUntilNextPeriod(), daysUntilNextPeriodEnding: daysUntilNextPeriod() === 1 ? '' : 's' } }}
    </p> -->
  } @else {
    <p class="metric-value metric-value--empty">--</p>
    <p class="metric-copy">
      {{ 'AddPeriodDayNextForecast' | translate }}
    </p>
  }
</article>
