<article class="metric-card metric-card--current" aria-labelledby="current-cycle-day-title">
  <p class="metric-eyebrow">{{ 'Dashboard' | translate }}</p>
  <h2 id="current-cycle-day-title" class="metric-title">{{ 'CurrentCycleDay' | translate }}</h2>

  @if (cycleDay() !== null) {
    <p class="metric-value">{{ cycleDay() }}</p>
    <!-- <p class="metric-copy">
      {{ 'DayOfCycleInfo' | translate: { cycleDay: cycleDay(), cycleLength: cycleLength() } }}
    </p> -->
  } @else {
    <p class="metric-value metric-value--empty">--</p>
    <p class="metric-copy">
      {{ 'AddPeriodDayCurrentCycle' | translate }}
    </p>
  }
</article>
